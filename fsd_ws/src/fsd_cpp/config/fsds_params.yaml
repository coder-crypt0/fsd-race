# fsd_cpp parameters for running against FSDS with the SINGLE camera defined
# in fsd_ws/fsds/settings.json.
#
# CAMERA GEOMETRY — why these numbers (see also ARCHITECTURE.md):
#   ONE camera, 640x480 @ 90 deg HFOV, mounted 1.0 m ahead of and 0.8 m above
#   the vehicle origin, on the centreline, pitch 0.
#
#   Single camera is the design target, not a fallback. It removes the two
#   things that actually bite on a car that vibrates: keeping a stereo pair
#   rectified, and keeping a measured baseline true. Bearing accuracy is
#   identical either way (same pixel, same intrinsics); only range degrades,
#   and range from a KNOWN CONE HEIGHT costs nothing to calibrate. An earlier
#   stereo pair here ran at 320x240 because the Intel Arc iGPU could not
#   sustain simGetImages on two 640x480 streams — one stream fits, so dropping
#   the second camera bought back the resolution, and resolution is what mono
#   range depends on:
#       fx = fy = (width/2) / tan(HFOV/2) = 320 / tan(45 deg) = 320
#       cx = width/2 = 320, cy = height/2 = 240
#   A 0.325 m cone at 10 m is 10.4 px tall at fx = 320 but only 5.2 px at
#   320x240, and mono range error is sigma = 1.5 * z / h_px — so the same cone
#   is +-1.4 m at full res against +-2.9 m at half res.
#
#   Pitch stays at zero deliberately: with fy = 320 and a 0.8 m mount the
#   ground enters frame 0.85 m in front of the camera already, so tilting down
#   buys no near-field view, and a non-zero pitch would need a rotation in the
#   pixel-to-bearing projection that the node does not carry.
#
#   cam_offset_y is 0.0 because the camera is on the centreline. With a stereo
#   pair it MUST become the LEFT camera's own lateral offset (half the
#   baseline, left positive) — the projection happens in the left camera frame,
#   and leaving it at zero biases every cone sideways.

stereo_cone:
  ros__parameters:
    mono_only: true
    # VERIFIED CONFIGURATION: one camera, 640x480 @ 90 deg HFOV, 1.0 m ahead of
    # and 0.8 m above the vehicle origin, pitch 0. This is the setup that drove
    # 465 m and mapped 422 cones. fx = fy = 320 / tan(45 deg) = 320 is pure
    # pinhole geometry, no calibration.
    #
    # A 3-camera rig (-45/0/+45) is implemented and is the right answer for
    # corners — a single 90 deg camera loses the inside boundary exactly when
    # entering a turn. It is NOT enabled here because the first attempt at
    # 3 x 424x320 mapped only 15 cones against 422, and that regression has not
    # been diagnosed yet (suspects: sim frame rate with three streams, or the
    # smaller cone pixel sizes at 424 px width versus min_contour_area_px and
    # mask_close_px). Re-enable by setting camera_topics/camera_yaw_deg below
    # and scaling the intrinsics to the chosen resolution.
    # Leave camera_topics unset for the single forward camera remapped by the
    # launch file. Multi-camera mono ranging created inconsistent duplicate
    # landmarks at overlap boundaries in live FSDS testing.
    # FSDS stability profile: 424x320 @ 70 deg HFOV. This preserves nearly
    # the same focal length/range precision as 640x480 @ 90 deg while cutting
    # image traffic by 56%, avoiding simGetImages RPC timeouts on the dev PC.
    fx: 302.8
    fy: 302.8
    cx: 212.0
    cy: 160.0
    baseline_m: 0.30         # only used when mono_only is false
    max_range_m: 18.0
    cam_offset_x: 1.0
    cam_offset_y: 0.0
    cam_offset_z: 0.8
    min_contour_area_px: 5
    mask_close_px: 7           # bridge the white stripe; see stereo_cone_node
    min_aspect: 0.7            # a cone is taller than wide; reject stripe bands
    max_aspect: 3.5
    horizon_row_px: 160        # level camera above ground: cy; gate bbox bottom
    max_disparity_px: 128
    patch_half_px: 7

state_estimation:
  ros__parameters:
    wheel_radius_m: 0.228
    publish_rate_hz: 50.0
    # FSDS rear drive wheels spin under acceleration and are a poor odometer.
    use_front_wheels: true
    use_imu_orientation: true
    use_map_correction: false
    max_correction_speed_mps: 1.0    # 0.02 m per 50 Hz tick: no pose jumps
    max_correction_yaw_rate: 0.3
    correction_reject_m: 2.0

cone_mapping:
  ros__parameters:
    search_radius_m: 2.0
    gate_threshold_m: 0.5
    n_confirm: 3
    tentative_timeout_s: 1.5
    # Mono range sigma = 0.0144*z^2 at fx=320: 1.5 m only let cones be mapped
    # to ~10 m, which on a 4 m cone pitch is 2-3 gate pairs — too few to spline
    # a path, and the run died with "chain of 2 midpoints too short". Mapping
    # out to ~15 m instead is safe because a landmark is CREATED with that
    # large variance and the Kalman update snaps it into place as soon as a
    # close-range sighting (sigma ~0.2 m) arrives.
    max_spawn_sigma_m: 3.5
    gate_sigma_scale: 3.0
    gate_max_m: 1.5
    publish_rate_hz: 10.0
    localize_enable: false
    localize_gate_m: 1.0             # < half the 3 m cone pitch
    localize_min_inliers: 6
    localize_min_obs: 5
    localize_min_landmarks: 12
    min_lap_distance_m: 20.0
    start_corridor_m: 6.0
    laps_to_known: 1                 # one mapped lap unlocks race speed

path_planning:
  ros__parameters:
    window_ahead_m: 25.0
    window_behind_m: 5.0
    edge_min_m: 1.5
    edge_max_m: 6.0
    sample_spacing_m: 0.5
    publish_rate_hz: 10.0
    default_track_width_m: 3.5
    chain_smooth_passes: 1
    chain_smooth_weight: 0.25
    raceline_enable: true
    known_window_ahead_m: 60.0       # >> braking distance from v_race
    known_window_behind_m: 3.0
    raceline_margin_m: 1.0
    raceline_iters: 400
    raceline_step: 0.03
    raceline_reg: 0.002
    raceline_min_clearance_m: 0.9
    global_rebuild_cone_delta: 3
    global_rebuild_min_period_s: 2.0
    # Short-lived local geometry bridges single-camera dropouts in corners
    # without accumulating full-lap odometry drift.
    local_detection_timeout_s: 0.35
    local_detection_max_sigma_m: 1.5
    local_detection_min_track_cones: 3
    local_cache_timeout_s: 3.0
    local_cache_merge_m: 0.75
    obstacle_gate_m: 1.1
    obstacle_clearance_m: 0.9
    obstacle_min_clearance_m: 0.5
    obstacle_blend_m: 5.0
    obstacle_blend_time_s: 0.8
    obstacle_blend_max_m: 12.0
    obstacle_edge_margin_m: 0.8
    obstacle_lookahead_m: 20.0
    obstacle_confirm_frames: 2
    obstacle_speed_mps: 3.0
    blocked_confirm_frames: 3
    obstacle_ignore_big_orange: true
    # Mono ranging maps cones to ~10 m, so the planned path is only a few
    # metres long early in a lap. At 5 m/s the car outran its own map, pure
    # pursuit aimed at the path end and went to full lock. Exploration speed
    # must respect the length of the path that actually exists — and 2.5 m/s
    # is still inside the Trackdrive minimum-average rule (D2.6.2).
    v_explore_mps: 2.5
    # Race speed is NOT "as fast as the car goes". Obstacle avoidance is only
    # meaningful if the car can still stop for something it has just seen:
    # 0.3 s of reaction plus v^2/(2*a_brake) must fit inside the range at which
    # this camera reliably detects a cone (~12 m at 320x240). At a_brake = 6:
    # 10 m/s -> 3.0 + 8.3 = 11.3 m. Raising this past ~10 m/s means accepting
    # that an unexpected object cannot be avoided, so raise it only together
    # with resolution/baseline (i.e. detection range), not on its own.
    v_race_mps: 10.0

motion_control:
  ros__parameters:
    wheelbase_m: 1.55        # FSDS car
    max_steering_rad: 0.35
    v_max_mps: 12.0          # absolute ceiling; the planner caps below this
    v_no_cap_mps: 5.0        # used only if /planning/speed_limit goes missing
    speed_limit_timeout_s: 1.0
    cap_ramp_mps2: 2.0
    a_lat_max: 6.0
    a_brake_max: 6.0
    a_accel_max: 3.0
    torque_max_nm: 30.0
    kp_speed: 12.0
    ki_speed: 2.0
    lookahead_gain_s: 0.8
    lookahead_min_m: 2.0
    lookahead_max_m: 8.0

safety_supervisor:
  ros__parameters:
    required_nodes: [stereo_cone, state_estimation, cone_mapping,
                     path_planning, motion_control, fsds_adapter]
    max_steering_rad: 0.35

fsds_adapter:
  ros__parameters:
    max_steering_rad: 0.35
    torque_max_nm: 30.0
    wheel_radius_m: 0.228
    steering_sign: -1.0      # flip to +1.0 if the sim car steers mirrored
    auto_go: true            # sim testing: start without an operator GO signal
